name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-example:
    name: build example project
    runs-on: ubuntu-latest
    container: ghcr.io/gmeligio/flutter-web:3.47.4

    steps:
      - uses: actions/checkout@v4

      - name: Check expected flutter version
        shell: python3 {0}
        run: |
          import json
          import subprocess

          fvmrc_version = json.load(open(".fvmrc"))["flutter"]
          version_output = subprocess.run(
              ["flutter", "--version", "--machine"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          sdk_version = json.loads(version_output[version_output.index("{"):])["frameworkVersion"]

          assert fvmrc_version == sdk_version, f"{fvmrc_version} != {sdk_version}"

      - name: Install dependencies
        working-directory: example/example_werkbank
        run: flutter pub get

      - name: Build web version of the example project
        working-directory: example/example_werkbank
        run: flutter build web --base-href /werkbank/

      - name: Upload the generated artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/example_werkbank/build/web
          retention-days: 90

  deploy-example:
    name: deploy example project
    runs-on: ubuntu-latest
    needs: build-example

    if: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
